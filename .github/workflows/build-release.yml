name: Build release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the build source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdkmanager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..30} > "$RUNNER_TEMP/android-license-responses"
          "$sdkmanager" --sdk_root="$sdk_dir" --licenses < "$RUNNER_TEMP/android-license-responses"
          "$sdkmanager" --sdk_root="$sdk_dir" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Build and run JVM tests
        run: bash gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify the release output
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: AIcheck-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
  retire-build-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 4
      - name: Remove the merged temporary build branch
        run: |
          ref='refs/heads/build/release-cdf61f9'
          merged_tip='55aab228672ca0075f533c7adfee8a6851e5e8a3'
          remote_tip="$(git ls-remote origin "$ref" | cut -f1)"
          if [ -z "$remote_tip" ]; then
            exit 0
          fi
          test "$remote_tip" = "$merged_tip"
          git merge-base --is-ancestor "$merged_tip" HEAD
          git push --force-with-lease="$ref:$merged_tip" origin ":$ref"
