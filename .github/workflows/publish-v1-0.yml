          unzip -jq android-build-tools.zip '*/lib/apksigner.jar'
          java -jar apksigner.jar verify --verbose --print-certs 'AIcheck-1.0-release.apk'
      - name: Publish the signed release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          作者：喵喵轩
          版本：1.0

          - 应用首页显示作者和版本信息。
          - 支持添加、编辑、删除和切换多套 API 配置，API Key 加密保存。
          - 本 APK 沿用本 fork 的 0.0.5 签名。已安装该版本时可直接更新。上游 0.0.4 使用不同签名，需先记录 API 配置，再卸载旧版并安装。

          上游项目：[alwayslone/AIcheck](https://github.com/alwayslone/AIcheck)

          APK SHA-256：`28adb2968506b2a21dfac3f089e8146c3f8150d3b1271829ebd65ed94c33005c`
          NOTES
          gh release create v1.0 'AIcheck-1.0-release.apk' --repo "$GITHUB_REPOSITORY" --target '7e46e4a31329b9246325dd059afa5ccab5f35e1e' --title 'AIcheck 1.0' --notes-file release-notes.md --latest
