          import struct
          from pathlib import Path

          unsigned = Path("app-release-unsigned.apk").read_bytes()
          signing_block = Path("signing-block.bin").read_bytes()
          end = unsigned.rfind(b"PK\x05\x06", max(0, len(unsigned) - 65557))
          assert end >= 0 and end + 22 <= len(unsigned)
          central_size, central, comment = struct.unpack_from("<IIH", unsigned, end + 12)
          assert central + central_size == end and end + 22 + comment == len(unsigned)
          assert signing_block.endswith(b"APK Sig Block 42")
          tail = bytearray(unsigned[central:])
          struct.pack_into("<I", tail, end - central + 16, central + len(signing_block))
          Path("AIcheck-1.0-release.apk").write_bytes(unsigned[:central] + signing_block + tail)
          PYTHON
