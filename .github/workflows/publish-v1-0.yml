name: Publish AIcheck 1.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1-0.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the tested APK for the versioned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45808538112 --repo "$GITHUB_REPOSITORY" --name AIcheck-release-unsigned --dir "$RUNNER_TEMP/release"
